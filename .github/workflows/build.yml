# Builds hub plugins and publishes to GitHub Pages when enabled.
#
# Secrets:  EOPLITE_SIGNING_KEY (signing key PEM)
# Variables: ENABLE_PUBLIC_PAGES = true

name: Build hub

on:
  push:
    branches: [master, main]
  workflow_dispatch:
  repository_dispatch:
    types: [client-release, eoplite-client-release]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zuchasjnda-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: plugin-hub

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Fetch plugin-hub tooling
        env:
          PACKAGER_URL: https://github.com/runelite/plugin-hub-tooling/releases/download/v1/bundle.tar.zst
        run: |
          set -eux
          curl --location --fail --retry 4 --max-time 120 -o bundle.tar.zst "$PACKAGER_URL"
          tar xf bundle.tar.zst
          ls -la
          ls -la plugin-hub/
          cat plugin-hub/runelite.version

      - uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            ~/.gradle/caches/
            api/
          key: hub-deps-${{ hashFiles('plugin-hub/runelite.version', 'bundle.tar.zst') }}

      - name: Prepare API cache
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: ./prepare.sh

      - name: Prepare plugins directory
        run: |
          mkdir -p plugin-hub/plugins
          # Remove anything that is not a real plugin manifest (no extension)
          find plugin-hub/plugins -type f -name '*.*' -delete
          find plugin-hub/plugins -type f -name '.*' -delete
          ls -la plugin-hub/plugins/

      - name: Verify access to private plugin repos
        env:
          REPO_CREDS: ${{ secrets.REPO_CREDS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          if [ -z "${REPO_CREDS:-}" ]; then
            CREDS="x-access-token:${GITHUB_TOKEN}"
            echo "::warning::REPO_CREDS is not set; only public repos are guaranteed to work."
          else
            CREDS="${REPO_CREDS}"
          fi
          for manifest in plugin-hub/plugins/*; do
            [ -f "$manifest" ] || continue
            plugin="$(basename "$manifest")"
            repo="$(grep '^repository=' "$manifest" | cut -d= -f2- | tr -d '\r')"
            commit="$(grep '^commit=' "$manifest" | cut -d= -f2- | tr -d '\r')"
            repo_path="${repo#https://github.com/}"
            repo_path="${repo_path#http://github.com/}"
            repo_path="${repo_path%.git}"
            echo "Checking plugin pin: ${plugin} @ ${commit:0:12}"
            if ! git ls-remote "https://${CREDS}@github.com/${repo_path}.git" "${commit}" >/dev/null 2>&1; then
              echo "::error::Cannot access source repo for plugin '${plugin}'. Set REPO_CREDS (username:PAT with read access to pinned private sources)."
              exit 1
            fi
          done

      - name: Package plugins
        env:
          FORCE_BUILD: ALL
          REPO_CREDS: ${{ secrets.REPO_CREDS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_IS_PR: "false"
        run: |
          set -eux
          export FORCE_BUILD=ALL
          export PACKAGE_COMMIT_RANGE=""
          if [ -z "${REPO_CREDS:-}" ]; then
            export REPO_CREDS="x-access-token:${GITHUB_TOKEN}"
          fi
          # Packager runs git clone over HTTPS; private repos need credentials on the URL.
          git config --global url."https://${REPO_CREDS}@github.com/".insteadOf "https://github.com/"
          EXPECTED_PLUGINS=$(find plugin-hub/plugins -maxdepth 1 -type f ! -name '.*' | wc -l)
          echo "Expected plugin manifests: ${EXPECTED_PLUGINS}"
          if [ -z "${REPO_CREDS:-}" ]; then
            echo "::warning::REPO_CREDS secret is not set; using GITHUB_TOKEN (cannot clone other private repos)."
          fi
          java -XX:+UseParallelGC -cp package.jar net.runelite.pluginhub.packager.Packager
          if [ ! -d /tmp/jars ] || [ -z "$(find /tmp/jars -name '*.jar' -print -quit)" ]; then
            echo "::error::No plugin JARs were built. Set REPO_CREDS if sources are private."
            exit 1
          fi
          BUILT_JARS=$(find /tmp/jars -name '*.jar' | wc -l)
          ls -la /tmp/jars/
          if [ "${BUILT_JARS}" -ne "${EXPECTED_PLUGINS}" ]; then
            echo "::error::Built ${BUILT_JARS} JAR(s) but hub lists ${EXPECTED_PLUGINS} plugin(s). Check logs above for clone/compile failures (often REPO_CREDS or a new private repo missing from a fine-grained PAT)."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: manifest_diff
          path: /tmp/manifest_diff
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: /tmp/jars
          retention-days: 1
          if-no-files-found: error

  publish-pages:
    needs: build
    if: vars.ENABLE_PUBLIC_PAGES == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin-hub

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Fetch plugin-hub tooling
        env:
          PACKAGER_URL: https://github.com/runelite/plugin-hub-tooling/releases/download/v1/bundle.tar.zst
        run: |
          set -eux
          curl --location --fail --retry 4 --max-time 120 -o bundle.tar.zst "$PACKAGER_URL"
          tar xf bundle.tar.zst

      - uses: actions/download-artifact@v4
        with:
          name: manifest_diff
          path: /tmp/manifest_diff_download

      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: /tmp/jars_download

      - name: Prepare artifacts for uploader
        run: |
          set -eux
          MANIFEST_FILE=$(find /tmp/manifest_diff_download -type f | head -1)
          test -n "$MANIFEST_FILE"
          cp "$MANIFEST_FILE" /tmp/manifest_diff
          mkdir -p /tmp/jars hub-site/jar hub-site/manifest hub-site/icon
          find /tmp/jars_download -name '*.jar' -exec cp -v {} hub-site/jar/ \;
          test "$(find hub-site/jar -name '*.jar' | wc -l)" -gt 0

      - name: Install rclone
        run: |
          set -eux
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Start WebDAV (rclone writes into hub-site)
        run: |
          set -eux
          mkdir -p hub-site/manifest hub-site/jar hub-site/icon
          nohup rclone serve webdav hub-site \
            --addr 127.0.0.1:8080 \
            --user local \
            --pass local \
            --dir-cache-time 0s \
            > /tmp/rclone-webdav.log 2>&1 &
          echo $! > /tmp/rclone-webdav.pid
          sleep 3
          curl -sf -u local:local http://127.0.0.1:8080/ || (cat /tmp/rclone-webdav.log && exit 1)

      - name: Sign and stage hub manifests
        env:
          SIGNING_KEY: ${{ secrets.EOPLITE_SIGNING_KEY }}
          REPO_CREDS: "local:local"
          REPO_ROOT: "http://127.0.0.1:8080/"
          PACKAGE_IS_PR: "false"
        run: |
          set -eux
          java -XX:+UseParallelGC -cp upload.jar net.runelite.pluginhub.uploader.Uploader
          find /tmp/jars_download -name '*.jar' -exec cp -v {} hub-site/jar/ \;
          python3 << 'PY'
          import json
          import pathlib
          import struct

          version = pathlib.Path("plugin-hub/runelite.version").read_text().strip()
          manifest_path = pathlib.Path(f"hub-site/manifest/{version}_lite.js")
          data = manifest_path.read_bytes()
          siglen = struct.unpack(">I", data[:4])[0]
          manifest = json.loads(data[4 + siglen :].decode())

          jar_dir = pathlib.Path("hub-site/jar")
          for jar in manifest.get("jars", []):
              plain = jar_dir / f"{jar['internalName']}.jar"
              hashed = jar_dir / f"{jar['internalName']}_{jar['jarHash']}.jar"
              if plain.exists():
                  plain.rename(hashed)
              if not hashed.exists():
                  raise SystemExit(f"missing jar file for {jar['internalName']}")
              if hashed.stat().st_size < 3500:
                  raise SystemExit(f"jar too small ({hashed.stat().st_size} bytes): {hashed}")
          PY
          ls -laR hub-site
          test -f hub-site/manifest/$(cat plugin-hub/runelite.version | tr -d '\n\r')_lite.js

      - name: Publish client version manifest aliases
        run: |
          set -euo pipefail
          HUB_VERSION="$(tr -d '\n\r' < plugin-hub/runelite.version)"
          CLIENT_VERSION=""
          if [ -f plugin-hub/q8mNx/version.json ]; then
            CLIENT_VERSION="$(jq -r '.version // empty' plugin-hub/q8mNx/version.json)"
          fi
          if [ -n "$CLIENT_VERSION" ] && [ "$CLIENT_VERSION" != "$HUB_VERSION" ]; then
            cp "hub-site/manifest/${HUB_VERSION}_lite.js" "hub-site/manifest/${CLIENT_VERSION}_lite.js"
            cp "hub-site/manifest/${HUB_VERSION}_full.js" "hub-site/manifest/${CLIENT_VERSION}_full.js"
            echo "Published manifest aliases: ${HUB_VERSION} -> ${CLIENT_VERSION}"
          fi
          for extra in 1.12.35 1.12.36 1.12.37 1.12.38 1.12.39; do
            if [ "$extra" != "$HUB_VERSION" ]; then
              cp "hub-site/manifest/${HUB_VERSION}_lite.js" "hub-site/manifest/${extra}_lite.js"
              cp "hub-site/manifest/${HUB_VERSION}_full.js" "hub-site/manifest/${extra}_full.js"
              echo "Published manifest alias: ${HUB_VERSION} -> ${extra}"
            fi
          done
          ls -la hub-site/manifest/

      - name: Publish client update feed
        run: |
          set -euo pipefail
          SRC="plugin-hub/q8mNx"
          CLIENT_SRC=""
          if [ -f "${SRC}/app.jar" ]; then
            CLIENT_SRC="${SRC}/app.jar"
          elif [ -f "${SRC}/EOPLite-client.jar" ]; then
            CLIENT_SRC="${SRC}/EOPLite-client.jar"
          fi
          if [ -z "${CLIENT_SRC}" ]; then
            echo "::warning::Missing client JAR in ${SRC} — skipping client feed on Pages."
            exit 0
          fi

          mkdir -p hub-site/q8mNx
          cp "${CLIENT_SRC}" hub-site/q8mNx/app.jar
          SHA256="$(sha256sum hub-site/q8mNx/app.jar | awk '{print $1}')"
          if [ -f "${SRC}/version.json" ]; then
            VERSION="$(jq -r .version "${SRC}/version.json")"
          else
            VERSION="$(tr -d '\n\r' < plugin-hub/runelite.version)"
          fi
          CLIENT_URL="https://jaieoakih.github.io/asngdajwk-plugins/q8mNx/app.jar"
          printf '{"version":"%s","sha256":"%s","clientUrl":"%s"}\n' "$VERSION" "$SHA256" "$CLIENT_URL" > hub-site/q8mNx/version.json
          mkdir -p hub-site/eoplite
          cp hub-site/q8mNx/app.jar hub-site/eoplite/EOPLite-client.jar
          LEGACY_URL="https://jaieoakih.github.io/asngdajwk-plugins/eoplite/EOPLite-client.jar"
          printf '{"version":"%s","sha256":"%s","clientUrl":"%s"}\n' "$VERSION" "$SHA256" "$LEGACY_URL" > hub-site/eoplite/version.json
          ls -la hub-site/q8mNx/ hub-site/eoplite/

      - name: Stop WebDAV
        if: always()
        run: |
          kill "$(cat /tmp/rclone-webdav.pid)" 2>/dev/null || true

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: hub-site

      - id: deployment
        uses: actions/deploy-pages@v4
